services:
  app:
    build:
      context: .
      args:
        NEW_UID: ${NEW_UID:-1000}
        NEW_GID: ${NEW_GID:-1000}
      dockerfile: docker/Dockerfile
    volumes:
      - ./:/src
      - ./secrets:/src/secrets
    ports:
      - "8502:8502"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8520/health"]
      start_period: 30s
      interval: 30m
    depends_on:
      - redis
    networks:
      zmodules:
        aliases:
          - source-connector-api-app

  app_ssl:
    image: httpd
    restart: "no"
    ports:
      - "8542:443"
    volumes:
      - "./secrets:/usr/local/secrets"
      - "./docker/httpd.conf:/usr/local/apache2/conf/httpd.conf"
      - "./docker/httpd-ssl.conf:/usr/local/apache2/conf/extra/httpd-ssl.conf"
    depends_on:
      app:
        condition: service_healthy
    networks:
      zmodules:
        aliases:
          - source-connector-api-app

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      zmodules:
        aliases:
          - source-connector-api-redis

networks:
  zmodules:
    driver: bridge
    name: zmodules
